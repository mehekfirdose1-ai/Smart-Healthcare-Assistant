<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartHealth | Admin Login</title><style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #dff3ff, #e8eaff, #f5faff);
    padding: 20px;
}

.login-container {
    width: 100%;
    max-width: 420px;
    background: white;
    padding: 40px 35px;
    border-radius: 20px;
    box-shadow: 0 12px 40px rgba(22, 68, 120, 0.14);
}

.logo {
    text-align: center;
    margin-bottom: 25px;
}

.logo-icon {
    width: 70px;
    height: 70px;
    margin: auto;
    background: #e3f3ff;
    color: #0879c9;
    border-radius: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 38px;
}

.logo h1 {
    color: #0879c9;
    margin-top: 12px;
    font-size: 27px;
}

.logo p {
    color: #777;
    margin-top: 5px;
    font-size: 14px;
}

h2 {
    text-align: center;
    color: #183b60;
    margin-bottom: 25px;
}

label {
    display: block;
    color: #344b63;
    font-weight: 600;
    margin-bottom: 8px;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #d6e1ed;
    border-radius: 10px;
    margin-bottom: 20px;
    outline: none;
    font-size: 15px;
}

input:focus {
    border-color: #168bd4;
    box-shadow: 0 0 0 3px #dcefff;
}

button {
    width: 100%;
    padding: 14px;
    background: linear-gradient(90deg, #0879c9, #1555b7);
    border: none;
    color: white;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 15px #b5d9f5;
}

.message {
    color: #c0392b;
    background: #fff0ef;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 15px;
    font-size: 14px;
}

.footer {
    text-align: center;
    margin-top: 25px;
    color: #888;
    font-size: 13px;
}
</style></head><body><div class="login-container"><div class="logo">
    <div class="logo-icon">✚</div>
    <h1>SmartHealth</h1>
    <p>Smart Healthcare Management System</p>
</div>

<h2>Admin Login</h2>

{% with messages = get_flashed_messages() %}
{% for message in messages %}
<div class="message">{{ message }}</div>
{% endfor %}
{% endwith %}

<form method="POST">

    <label>Admin Email</label>
    <input type="email" name="email"
           placeholder="Enter admin email" required>

    <label>Password</label>
    <input type="password" name="password"
           placeholder="Enter password" required>

    <button type="submit">Login to Dashboard →</button>

</form>

<div class="footer">
    © 2026 SmartHealth | Admin Portal
</div>

</div></body>
</html>
